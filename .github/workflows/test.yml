name: Test

# Runs the tests (for now, the regression test of StoryParser) on each pull request.
on:
  pull_request:
  push:
    branches:
      - develop
      - main

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The tests run on the sources of the packages: no build needed. In CI, Vitest doesn't
      # write missing snapshots, it fails.
      - name: Run the tests
        run: npm test
