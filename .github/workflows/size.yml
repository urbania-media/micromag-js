name: Size

# Builds @micromag/viewer-build and checks its initial JS and CSS (gzip) against the budget of
# packages/viewer-build/size-budget.json. The sizes are shown in the summary of the job.
on:
  pull_request:
  push:
    branches:
      - develop
      - main

concurrency:
  group: size-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  viewer-build:
    name: Viewer bundle size
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # viewer-build bundles the built packages (es/ and assets/): build @micromag/viewer and the
      # packages it depends on first
      - name: Build the packages of the viewer
        run: npx nx run @micromag/viewer:build

      - name: Build the viewer with stats
        run: npm run build:stats --workspace=@micromag/viewer-build

      - name: Check the size budget
        run: node scripts/check-viewer-build-size.mjs
