name: Publish

# Publishes the packages to npm with trusted publishing (OIDC), without any npm token.
# Each package must trust this workflow and the `npm` environment on npmjs.com (see
# scripts/npm-trust.sh).
#
# Two jobs, so that the code of the dependencies never runs where the OIDC token is:
# - `pack` installs, builds and packs every public package, with read-only permissions;
# - `publish` downloads the tarballs and publishes the ones whose version isn't on npm yet. It
#   installs nothing and runs no script of the packages: it only has npm, from the `npm` environment.
# This covers both cases of `lerna publish`: the versions of the tag created by `lerna version`
# (from-git), and the versions missing from npm after a failed publish (from-package).
on:
  # Tags created by `lerna version`
  push:
    tags:
      - 'v*'
  # Publishes the versions in package.json files that are missing from npm
  # (ex.: after a failed publish)
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions: {}

jobs:
  pack:
    name: Build and pack
    runs-on: ubuntu-latest
    if: github.repository == 'urbania-media/micromag-js'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: '.nvmrc'

      # No secret and read-only permissions here: the install scripts of the dependencies can run
      - name: Install dependencies
        run: npm ci

      # The published packages need the other packages to be built (ex.: @micromag/core css)
      # The runner has 4 CPUs; Nx runs 3 tasks at a time by default
      - name: Build packages
        run: npx nx run-many --target=build --parallel=4

      # npm pack doesn't run prepublishOnly: the packages are already built
      - name: Pack packages
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          npx lerna exec --no-private --concurrency 4 -- npm pack --pack-destination "$RUNNER_TEMP/packages"
          ls -1 "$RUNNER_TEMP/packages"

      - name: Upload the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: pack
    runs-on: ubuntu-latest
    # The `npm` environment only accepts the `v*` tags and develop (Settings → Environments). Once
    # the trusted publisher of each package on npmjs.com names it, no other job can publish.
    environment: npm
    permissions:
      contents: read
      id-token: write # Required for trusted publishing
    steps:
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages

      # Trusted publishing needs npm 11.5.1 or later; provenance is added on its own. The packages
      # are published 4 at a time: each one gets its own OIDC token and provenance signature. A
      # version already on npm is skipped, so a failed run can be run again (workflow_dispatch).
      - name: Publish missing versions
        working-directory: ${{ runner.temp }}/packages
        env:
          CONCURRENCY: 4
        run: |
          npm --version
          results="$RUNNER_TEMP/publish-results"
          mkdir -p "$results"

          publish_package() {
            local tarball="$1" manifest name version
            manifest=$(tar -xOzf "$tarball" package/package.json 2>/dev/null)
            name=$(jq -r '.name // empty' <<<"$manifest" 2>/dev/null)
            version=$(jq -r '.version // empty' <<<"$manifest" 2>/dev/null)
            if [ -z "$name" ] || [ -z "$version" ]; then
              echo "No package.json in $tarball" > "$results/$tarball.log"
              echo "failed $tarball" > "$results/$tarball.status"
              return 0
            fi
            if npm view "$name@$version" version --silent >/dev/null 2>&1; then
              echo "skipped $name@$version" > "$results/$tarball.status"
              return 0
            fi
            if npm publish "./$tarball" --access public --ignore-scripts > "$results/$tarball.log" 2>&1; then
              echo "published $name@$version" > "$results/$tarball.status"
            else
              echo "failed $name@$version" > "$results/$tarball.status"
            fi
          }
          export -f publish_package
          export results

          ls -1 *.tgz | xargs -P "$CONCURRENCY" -I {} bash -c 'publish_package "$1"' _ {}

          for log in "$results"/*.log; do
            [ -e "$log" ] || continue
            tarball=$(basename "$log" .log)
            echo "::group::$(cut -d' ' -f2 "$results/$tarball.status")"
            cat "$log"
            echo "::endgroup::"
          done

          cat "$results"/*.status | sort -k2 > "$results/all"
          grep '^skipped ' "$results/all" | sed 's/^skipped \(.*\)/\1 is already on npm/' || true
          { grep '^failed ' "$results/all" || true; } | while read -r _ package; do
            echo "::error::Publishing $package failed (see its group in the log)"
          done
          tarballs=$(ls -1 *.tgz | wc -l)
          statuses=$(wc -l < "$results/all")
          published=$(grep -c '^published ' "$results/all" || true)
          failed=$(grep -c '^failed ' "$results/all" || true)
          {
            echo "Published $published package(s), $failed failed"
            { grep -E '^(published|failed) ' "$results/all" || true; } | sed 's/^/- /'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$statuses" -ne "$tarballs" ]; then
            echo "::error::$tarballs tarballs but $statuses results"
            exit 1
          fi
          if [ "$failed" -gt 0 ]; then
            exit 1
          fi
